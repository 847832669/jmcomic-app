# Codemagic backup build: unsigned IPA, mirrors .github/workflows/build.yml
# Manual start only (no automatic triggers configured).
workflows:
  ios-unsigned:
    name: JM Reader iOS unsigned
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build (no signing)
        script: |
          xcodebuild -project JMReader.xcodeproj -scheme JMReader \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        script: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry JMReader-unsigned.ipa Payload
          ls -lh JMReader-unsigned.ipa
    artifacts:
      - JMReader-unsigned.ipa
